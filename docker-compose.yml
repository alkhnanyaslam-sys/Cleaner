version: "3.9"

services:
  bot:
    build: .
    container_name: audio-separator-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./database:/app/database
